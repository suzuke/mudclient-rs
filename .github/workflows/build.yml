name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build each platform ──
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libgl-dev \
            libegl-dev \
            libfontconfig1-dev \
            libatk1.0-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build -p mudgui --release --target ${{ matrix.target }}

      # ── Windows: sign exe, then zip with scripts, data & docs ──
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/mudgui.exe" dist/
          Copy-Item -Recurse scripts dist/scripts
          Copy-Item -Recurse data dist/data
          Copy-Item -Recurse docs dist/docs

      - name: Sign Executable (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_P12 != ''
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12)
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Find signtool.exe
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          & $signtool sign `
            /f $certPath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            dist/mudgui.exe

          Remove-Item $certPath

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath mudgui-windows-x64.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mudgui-windows-x64
          path: mudgui-windows-x64.zip

      # ── Linux: tar.gz with scripts, data & docs ──
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mudgui dist/
          cp -r scripts dist/scripts
          cp -r data dist/data
          cp -r docs dist/docs
          tar -czf mudgui-linux-x64.tar.gz -C dist .

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mudgui-linux-x64
          path: mudgui-linux-x64.tar.gz

      # ── macOS: upload raw binary for universal merge ──
      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mudgui-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mudgui

  # ── macOS: merge into Universal Binary + sign + notarize + DMG ──
  package-macos:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: mudgui-aarch64-apple-darwin
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: mudgui-x86_64-apple-darwin
          path: bin-x86_64

      - name: Create Universal Binary
        run: |
          chmod +x bin-arm64/mudgui bin-x86_64/mudgui
          lipo -create bin-arm64/mudgui bin-x86_64/mudgui -output mudgui-universal
          file mudgui-universal

      - name: Build .app bundle
        run: |
          APP="MudClient.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp mudgui-universal "$APP/Contents/MacOS/mudgui"
          chmod +x "$APP/Contents/MacOS/mudgui"

          cp packaging/macos/Info.plist "$APP/Contents/"

          cp -r scripts "$APP/Contents/Resources/scripts"
          cp -r data "$APP/Contents/Resources/data"
          cp -r docs "$APP/Contents/Resources/docs"

          if [ -f packaging/macos/AppIcon.icns ]; then
            cp packaging/macos/AppIcon.icns "$APP/Contents/Resources/"
          fi

      - name: Import Apple Certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Codesign .app bundle
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application ($APPLE_TEAM_ID)"
          codesign --force --options runtime --deep \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$IDENTITY" \
            --timestamp \
            MudClient.app
          codesign --verify --verbose MudClient.app

      - name: Create DMG
        run: |
          DMG_TEMP="dmg_staging"
          mkdir -p "$DMG_TEMP"
          cp -r MudClient.app "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"

          hdiutil create -volname "MudClient" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            MudClient-macos-universal.dmg

          rm -rf "$DMG_TEMP"

      - name: Notarize DMG
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit MudClient-macos-universal.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          xcrun stapler staple MudClient-macos-universal.dmg

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mudgui-macos-universal
          path: MudClient-macos-universal.dmg

  # ── Attach to GitHub Release ──
  release:
    needs: [build, package-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mudgui-windows-x64/mudgui-windows-x64.zip
            artifacts/mudgui-linux-x64/mudgui-linux-x64.tar.gz
            artifacts/mudgui-macos-universal/MudClient-macos-universal.dmg
          generate_release_notes: true
